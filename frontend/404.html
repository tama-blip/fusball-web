<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Halaman tidak ditemukan — Fusball.id</title>
  <link rel="icon" href="/assets/images/logo-mark.svg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .not-found{min-height:100vh;display:grid;place-items:center;padding:48px 24px}
    .not-found-card{width:min(100%,760px);padding:clamp(28px,6vw,64px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#151a1b,#0b0e0f);box-shadow:var(--shadow)}
    .not-found-code{font-size:clamp(76px,18vw,160px);line-height:.8;letter-spacing:-.1em;font-weight:950;color:var(--accent)}
    .not-found h1{font-size:clamp(30px,5vw,54px);line-height:1;letter-spacing:-.07em;margin-top:28px}
    .not-found p{max-width:520px;color:var(--muted);margin-top:16px}
    .not-found-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
  </style>
</head>
<body>
  <main class="not-found">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <span class="kicker">FUSBALL.ID / PAGE NOT FOUND</span>
      <div class="not-found-code" aria-hidden="true">404</div>
      <h1 id="not-found-title">Halaman ini tidak ditemukan.</h1>
      <p>Alamatnya mungkin berubah, tautannya sudah lama, atau halaman tersebut memang tidak tersedia. Kembali ke halaman utama atau lanjutkan menjelajahi koleksi Fusball.id.</p>
      <div class="not-found-actions">
        <a class="btn btn-primary" href="/">Kembali ke Beranda</a>
        <a class="btn btn-ghost" href="/shop.html">Jelajahi Koleksi</a>
      </div>
    </section>
  </main>
</body>
</html>
