<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar — Fusball.id</title>
<link rel="icon" href="assets/images/logo-mark.svg"><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
<div id="site-header"></div>
<main class="auth-shell">
<section class="auth-card">
<span class="kicker">ACCOUNT</span>
<h1>Buat akunmu.</h1>
<p>Daftar untuk menyimpan akun dan riwayat pesanan.</p>
<form id="register-form">
<label>Nama<input name="name" autocomplete="name" required></label>
<label>Email<input name="email" type="email" autocomplete="email" required></label>
<label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
<button class="btn btn-primary" type="submit">Buat Akun ↗</button>
<p id="register-message" class="form-message"></p>
</form>
<div class="auth-switch">Sudah punya akun? <a href="login.html">Masuk</a></div>
</section>
</main>
<div id="site-footer"></div>
<script src="js/products.js"></script><script src="js/format.js"></script><script src="js/content.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
<script>
document.getElementById("register-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.currentTarget;
  const data = Object.fromEntries(new FormData(form).entries());
  const message = document.getElementById("register-message");
  message.textContent = "Creating account…";
  try {
    const result = await apiSend("/auth/register", "POST", data);
    setAuth(result);
    message.textContent = "Account created.";
    setTimeout(() => location.href = "/index.html", 300);
  } catch (error) {
    message.textContent = error.message;
  }
});
</script>
</body>
</html>
