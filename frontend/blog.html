<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fusball.id Journal — cerita, football culture, desain, dan update koleksi."><title>Journal — Fusball.id</title><link rel="icon" href="assets/images/logo-mark.svg"><link rel="stylesheet" href="css/style.css"></head><body data-page="blog"><div id="site-header"></div><main><section class="journal-hero shell"><span class="kicker">FUSBALL.ID / JOURNAL</span><h1>Stories beyond<br><em>the shirt.</em></h1><p class="detail-desc" style="max-width:680px">Kumpulan artikel, referensi, dan cerita yang dipilih tim Fusball.id. Semua artikel diarahkan ke sumber asli, karena mengarang blog sendiri sudah cukup dilakukan internet.</p></section><section class="section shell"><div class="section-head-v9"><div><span class="kicker">LATEST STORIES</span><h2>Football culture, design & identity.</h2></div></div><div id="blog-grid" class="editorial-list-grid"></div></section></main><div id="site-footer"></div><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('blog-grid');try{const rows=await apiGet('/blog');root.innerHTML=rows.length?rows.map(x=>`<article class="editorial-card"><div class="editorial-card-media">${x.image_url?`<img src="${escapeHtml(x.image_url)}" alt="">`:'<div style="height:100%;display:grid;place-items:center;color:#667174;font-size:10px;letter-spacing:.12em">FUSBALL JOURNAL</div>'}</div><div class="editorial-card-body"><span class="kicker">JOURNAL</span><h3 class="journal-title">${escapeHtml(x.title)}</h3><p>${escapeHtml(x.excerpt||'Baca artikel selengkapnya melalui sumber asli.')}</p><a class="text-link" href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer">Baca artikel ↗</a></div></article>`).join(''):'<div class="empty-v10" style="grid-column:1/-1">Belum ada artikel. Tambahkan link dari Control Room.</div>'}catch(e){root.innerHTML='<div class="empty-v10" style="grid-column:1/-1">Journal belum dapat dimuat.</div>'}});function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}</script></body></html>
